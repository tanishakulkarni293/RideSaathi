<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ridesathi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-brand">
                <h1>🚕 Ridesathi</h1>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="login.html" class="nav-link active">Login</a>
                <a href="register.html" class="nav-link">Register</a>
            </div>
        </nav>

        <!-- Login Section -->
        <section class="auth-section">
            <div class="auth-container">
                <h2>Login to Ridesathi</h2>
                <p class="auth-subtitle">Select your login type</p>

                <!-- Login Type Tabs -->
                <div class="tabs">
                    <button class="tab-btn active" data-tab="user-login">User Login</button>
                    <button class="tab-btn" data-tab="driver-login">Driver Login</button>
                </div>

                <!-- User Login Form -->
                <div id="user-login" class="tab-content active">
                    <form id="userLoginForm" class="form">
                        <div class="form-group">
                            <label for="userEmail">Email Address</label>
                            <input type="email" id="userEmail" name="email" required placeholder="Enter your email">
                        </div>

                        <div class="form-group">
                            <label for="userPassword">Password</label>
                            <input type="password" id="userPassword" name="password" required placeholder="Enter your password">
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Login as User</button>
                    </form>
                    <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
                </div>

                <!-- Driver Login Form -->
                <div id="driver-login" class="tab-content">
                    <form id="driverLoginForm" class="form">
                        <div class="form-group">
                            <label for="driverEmail">Email Address</label>
                            <input type="email" id="driverEmail" name="email" required placeholder="Enter your email">
                        </div>

                        <div class="form-group">
                            <label for="driverPassword">Password</label>
                            <input type="password" id="driverPassword" name="password" required placeholder="Enter your password">
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Login as Driver</button>
                    </form>
                    <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
                </div>

                <!-- Status Messages -->
                <div id="loginMessage" class="message"></div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Ridesathi. All rights reserved.</p>
        </footer>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        // Tab switching functionality
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.getAttribute('data-tab');
                
                // Remove active class from all buttons and contents
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));
                
                // Add active class to clicked button and corresponding content
                button.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });

        // User Login Handler
        document.getElementById('userLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('userEmail').value;
            const password = document.getElementById('userPassword').value;
            const messageDiv = document.getElementById('loginMessage');

            try {
                const response = await fetch(`${API_BASE}/auth/login/user`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token and user info
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userId', data.user.id);
                    localStorage.setItem('userName', data.user.name);
                    localStorage.setItem('userType', 'user');
                    
                    messageDiv.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';
                    setTimeout(() => {
                        window.location.href = 'user-dashboard.html';
                    }, 1500);
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-error">${data.message}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert alert-error">Error: ${error.message}</div>`;
            }
        });

        // Driver Login Handler
        document.getElementById('driverLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('driverEmail').value;
            const password = document.getElementById('driverPassword').value;
            const messageDiv = document.getElementById('loginMessage');

            try {
                const response = await fetch(`${API_BASE}/auth/login/driver`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token and driver info
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('driverId', data.driver.id);
                    localStorage.setItem('driverName', data.driver.name);
                    localStorage.setItem('userType', 'driver');
                    
                    messageDiv.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';
                    setTimeout(() => {
                        window.location.href = 'driver-dashboard.html';
                    }, 1500);
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-error">${data.message}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert alert-error">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
